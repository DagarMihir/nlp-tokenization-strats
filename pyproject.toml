[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-tokenization-strats"
version = "0.1.0"
description = "Tokenization strategy comparison for NLP coursework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "matplotlib>=3.8.0",
  "nltk>=3.9.0",
  "pandas>=2.2.0",
  "spacy>=3.7.0",
  "tokenizers>=0.15.0",
  "tiktoken>=0.8.0",
  "tabulate>=0.9.0",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
